<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Chain Reaction - Interactive Physics Simulation</title>
    <meta name="description" content="An interactive, high-performance quantum particle and chain reaction simulation built with HTML5 Canvas, featuring custom physics, dynamic speed scaling, and molecular combinations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Chart.js for visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Background Canvas for the Quantum Simulation -->
    <canvas id="simulationCanvas"></canvas>

    <!-- Top Floating Unified Control & Stats Dashboard -->
    <header id="top-dashboard" class="glass-panel" role="banner">
        <!-- Simulation Controls -->
        <div class="control-group-dock">
            <button id="btn-play-pause" class="dock-btn active" aria-label="Pause Simulation" title="Play/Pause Simulation">
                <i data-lucide="pause" class="icon icon-pause"></i>
                <i data-lucide="play" class="icon icon-play hidden"></i>
            </button>
            <button id="btn-reset" class="dock-btn alert-btn" title="Reset Simulation">
                <i data-lucide="rotate-ccw" class="icon"></i>
            </button>
            <button id="btn-add-ten" class="dock-btn" title="Spawn Random Molecules">
                <i data-lucide="plus-circle" class="icon"></i>
            </button>
            <input type="number" id="input-add-count" class="dock-input" value="10" min="1" max="999" title="Number of molecules to spawn">
        </div>

        <div class="vertical-divider"></div>

        <!-- Mouse Interaction Mode (Segmented Toggle) -->
        <div class="segmented-control" role="group" aria-label="Mouse Pointer Mode">
            <button id="btn-mode-decay" class="dock-btn active" aria-pressed="true" title="Click Mode: Trigger Decay (Click molecule to split it)">
                <i data-lucide="zap" class="icon"></i>
            </button>
            <button id="btn-mode-spawn" class="dock-btn" aria-pressed="false" title="Click Mode: Spawn Molecule (Click space to inject)">
                <i data-lucide="plus" class="icon"></i>
            </button>
        </div>

        <div class="vertical-divider"></div>

        <!-- Simulation Rules -->
        <div class="control-group-dock">
            <button id="btn-spontaneous-gen" class="dock-btn" aria-pressed="true" title="Toggle Spontaneous Generation">
                <i data-lucide="sparkles" class="icon"></i>
            </button>
            <button id="btn-spontaneous-decay" class="dock-btn" aria-pressed="true" title="Toggle Spontaneous Decay">
                <i data-lucide="split" class="icon"></i>
            </button>
            <button id="btn-screen-wrap" class="dock-btn" aria-pressed="false" title="Toggle Screen Wrap / Boundaries">
                <i data-lucide="infinity" class="icon"></i>
            </button>
        </div>

        <div class="vertical-divider"></div>

        <!-- Real-Time Telemetry Stats -->
        <div id="stats-container">
            <div class="stat-bubble" title="Elapsed Time">
                <i data-lucide="clock" class="stat-icon"></i>
                <span id="simTimeDisplay" class="value">00:00</span>
            </div>
            
            <div class="stat-bubble" title="Active Molecules">
                <i data-lucide="orbit" class="stat-icon"></i>
                <span id="moleculeCountDisplay" class="value">000</span>
            </div>
            
            <div class="stat-bubble" title="Free Electrons (Energy)">
                <i data-lucide="zap" class="stat-icon glow-yellow"></i>
                <span id="electronCountDisplay" class="value">000</span>
            </div>
            
            <div class="stat-bubble" title="Discovered Unique Combinations">
                <i data-lucide="flask-conical" class="stat-icon"></i>
                <span id="uniqueCombinationsDisplay" class="value">000</span>
            </div>
            
            <div class="stat-bubble" title="Dynamic Time Dilated Slowdown">
                <i data-lucide="gauge" class="stat-icon"></i>
                <span id="timeScaleDisplay" class="value">0%</span>
            </div>
        </div>

        <div class="vertical-divider"></div>

        <!-- UI Widget Toggles & Sidebar settings trigger -->
        <div class="control-group-dock">
            <button id="btn-toggle-chart" class="dock-btn" aria-pressed="false" title="Toggle Discovery Chart">
                <i data-lucide="activity" class="icon"></i>
            </button>
            <button id="btn-toggle-discoveries" class="dock-btn" aria-pressed="false" title="Toggle Discoveries Log">
                <i data-lucide="history" class="icon"></i>
            </button>
            <div class="dock-divider"></div>
            <button id="btn-settings-toggle" class="dock-btn" title="Open Custom Quantities Panel">
                <i data-lucide="sliders" class="icon"></i>
            </button>
        </div>
    </header>

    <!-- Floating rate of discovery graph widget (Hidden by default) -->
    <section id="chart-container" class="glass-panel hidden" aria-label="Discovery Analytics">
        <div class="chart-header">
            <h3>Discovery Rate</h3>
        </div>
        <div class="chart-wrapper">
            <canvas id="discoveryChart"></canvas>
        </div>
    </section>

    <!-- Slide-out Configuration Sidebar (Sliders only) -->
    <aside id="config-sidebar" role="complementary" aria-label="Simulation Parameters">
        <div id="config-header">
            <h2>Simulation Setup</h2>
            <button id="config-close" class="toggle-button" aria-label="Close Settings">
                <i data-lucide="x"></i>
            </button>
        </div>
        
        <div id="config-controls">
            <!-- Numerical Parameters -->
            <div class="control-group" title="Initial Molecules: Sets the starting count of compound molecules generated on start.">
                <label for="numMoleculesSlider">Initial Molecules: <span id="numMoleculesValue" class="slider-val">30</span></label>
                <input type="range" id="numMoleculesSlider" min="10" max="100" value="30">
            </div>
            
            <div class="control-group" title="Max Palette Colors: Select the maximum number of distinct colors used to populate molecular structures.">
                <label for="colorCountSelect">Max Palette Colors</label>
                <div class="select-wrapper">
                    <select id="colorCountSelect">
                        <option value="2">2 Colors</option>
                        <option value="4">4 Colors</option>
                        <option value="6">6 Colors</option>
                        <option value="8">8 Colors</option>
                        <option value="10">10 Colors</option>
                        <option value="12">12 Colors</option>
                        <option value="14" selected>14 Colors (Max)</option>
                    </select>
                </div>
            </div>
            
            <div class="control-group" title="Simulation Area Size: Scales the physical boundary size of the simulation relative to the viewport. Zoom out is applied automatically.">
                <label for="simulationAreaSlider">Simulation Area Size: <span id="simulationAreaValue" class="slider-val">1.0x</span></label>
                <input type="range" id="simulationAreaSlider" min="10" max="30" value="10">
            </div>
            
            <div class="control-group" title="Discovery Item Scale: Adjusts the visual size of discovery canvas thumbnails in the bottom log.">
                <label for="miniParticleScaleSlider">Discovery Item Scale: <span id="miniParticleScaleValue" class="slider-val">1.0x</span></label>
                <input type="range" id="miniParticleScaleSlider" min="5" max="20" value="10">
            </div>
            
            <div class="control-group" title="Time-scale Transition Smoothness: Determines how fast the slow-motion time dilation shifts during high energy events.">
                <label for="lerpFactorSlider">Time-scale Transition Smoothness: <span id="lerpFactorValue" class="slider-val">0.050</span></label>
                <input type="range" id="lerpFactorSlider" min="1" max="200" value="50">
            </div>
            
            <div class="control-group" title="Simulation Speed: Sets the speed multiplier of the physics timeline.">
                <label for="simSpeedSlider">Simulation Speed: <span id="simSpeedValue" class="slider-val">1.0x</span></label>
                <input type="range" id="simSpeedSlider" min="1" max="50" value="10">
            </div>
            
            <div class="control-group" title="Spontaneous Gen Multiplier: Scales the frequency of random molecule generation in empty space.">
                <label for="spawnChanceSlider">Spontaneous Gen Multiplier: <span id="spawnChanceValue" class="slider-val">1.0x</span></label>
                <input type="range" id="spawnChanceSlider" min="0" max="100" value="10">
            </div>
            
            <div class="control-group" title="Spontaneous Decay Multiplier: Scales the frequency of molecules randomly splitting into smaller parts.">
                <label for="decayChanceSlider">Spontaneous Decay Multiplier: <span id="decayChanceValue" class="slider-val">1.0x</span></label>
                <input type="range" id="decayChanceSlider" min="0" max="100" value="10">
            </div>
            
            <div class="control-group" title="Quantum Drift Strength: Controls the amplitude of random quantum drift forces perpendicular to motion.">
                <label for="driftStrengthSlider">Quantum Drift Strength: <span id="driftStrengthValue" class="slider-val">1.0x</span></label>
                <input type="range" id="driftStrengthSlider" min="0" max="30" value="10">
            </div>
            
            <div class="control-group" title="Collision Bounciness: Sets the Coefficient of Restitution: lower values are sticky, higher values bounce faster.">
                <label for="elasticitySlider">Collision Bounciness: <span id="elasticityValue" class="slider-val">1.0x</span></label>
                <input type="range" id="elasticitySlider" min="2" max="15" value="10">
            </div>
            
            <div class="control-group" title="Instability Speed Limit: Sets the threshold velocity above which molecules destabilize and split.">
                <label for="instabilityThresholdSlider">Instability Speed Limit: <span id="instabilityThresholdValue" class="slider-val">3.0</span></label>
                <input type="range" id="instabilityThresholdSlider" min="10" max="50" value="30">
            </div>
            
            <div class="control-group" title="Electron Energy Lifespan: Controls the survival duration of free high-energy electrons before they decay.">
                <label for="electronLifespanSlider">Electron Energy Lifespan: <span id="electronLifespanValue" class="slider-val">1.0x</span></label>
                <input type="range" id="electronLifespanSlider" min="2" max="30" value="10">
            </div>
            
            <hr class="divider">

            <!-- Dropdown Options -->
            <div class="control-group" title="Chart Time Window: Adjusts the moving average window timeframe displayed by the discovery analytics chart.">
                <label for="chartTimeWindowSelect">Chart Time Window (Moving Avg)</label>
                <div class="select-wrapper">
                    <select id="chartTimeWindowSelect">
                        <option value="10000">10 Seconds</option>
                        <option value="30000" selected>30 Seconds</option>
                        <option value="60000">1 Minute</option>
                    </select>
                </div>
            </div>

            <div class="control-group" title="GPU Optimization: Disabling background blur effects significantly reduces GPU load and power consumption on integrated graphics cards.">
                <label for="gpuOptimizationSelect">GPU Optimization (Blur Effect)</label>
                <div class="select-wrapper">
                    <select id="gpuOptimizationSelect">
                        <option value="enabled" selected>Optimized (No Blur - Low GPU)</option>
                        <option value="disabled">Beautiful Glassmorphism (High GPU)</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div id="config-footer">
            <button id="resetButton" class="btn-primary" title="Apply configuration changes and reset the active simulation environment.">Apply &amp; Reset Simulation</button>
        </div>
    </aside>

    <!-- Bottom Drawer for Log of Discovered Unique Combinations (Hidden by default) -->
    <footer id="unique-combinations-bar" class="hidden" role="contentinfo" aria-label="Discovered Molecule Combinations">
        <!-- Discovered unique combinations will be injected here dynamically -->
    </footer>

    <!-- Main script entry point -->
    <script type="module" src="js/Main.js"></script>
</body>
</html>
